[manager]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 1200
max_height = 1000

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Edit" },
]
pdf = [
	{ run = 'zathura "$@"', orphan = true, desc = "Open PDF" },
]
image = [
	{ run = 'feh "$@"', orphan = true, desc = "View image" },
]

[open]
rules = [
	# Order matters: yazi takes the FIRST match, so the catch-all must be LAST.
	# The laptop's version had { mime = "*/*" } third, which made every rule after
	# it dead. This machine's version had no catch-all at all.
	{ mime = "inode/directory", use = [ "edit", "open", "reveal" ] },
	{ mime = "application/pdf", use = [ "pdf" ] },
	{ mime = "image/*", use = [ "image" ] },
	{ mime = "text/*", use = [ "edit", "open", "reveal" ] },
	{ mime = "application/json", use = [ "edit", "open", "reveal" ] },
	{ mime = "application/javascript", use = [ "edit", "open", "reveal" ] },
	{ mime = "*/*", use = [ "edit", "open", "reveal" ] },
]
