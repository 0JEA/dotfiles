[manager]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 1200
max_height = 1000

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Edit" },
]
pdf = [
	{ run = 'zathura "$@"', orphan = true, desc = "Open PDF" },
]
image = [
	{ run = 'feh "$@"', orphan = true, desc = "View image" },
]

[open]
rules = [
	{ mime = "application/pdf", use = [ "pdf" ] },
	{ mime = "image/*", use = [ "image" ] },
	{ mime = "*/*", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", use = [ "edit", "open", "reveal" ] },
	{ mime = "application/json", use = [ "edit", "open", "reveal" ] },
	{ mime = "application/javascript", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.asm", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.s", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.css", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.html", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.lua", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.py", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.cpp", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.c", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", name = "*.h", use = [ "edit", "open", "reveal" ] },
]
