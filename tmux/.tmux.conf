# ==============================================================================
# TMUX CONFIGURATION (.tmux.conf)
# ==============================================================================
# This configuration file defines the look, feel, and behavior of tmux.
# It is designed to be easily modified by LLMs and human users.
# ==============================================================================

# --- TERMINAL & COLOR SETTINGS ---
# Use screen-256color for broad compatibility
set -g default-terminal "screen-256color"
# Enable RGB/TrueColor support
set -ag terminal-overrides ",xterm-256color:RGB"

# Allow kitty graphics protocol escape sequences through (inline images/plots)
set -gq allow-passthrough on
set -g visual-activity off

# --- KEY BINDINGS ---
# Set the prefix to Ctrl-a (more ergonomic than Ctrl-b)
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Reload config with 'r' key (useful for rapid testing)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# --- MOUSE & STATUS BEHAVIOR ---
set -g mouse on
set -g status off
set -g destroy-unattached on # Kill session when terminal window is closed

# --- CLIPBOARD (Wayland) ---
# EVERY tmux copy goes to the system clipboard: drag, double/triple-click,
# Enter/M-w/C-w, and Ctrl+C. Without copy-command, double-click and keyboard
# copies only reached tmux's internal buffer, so Ctrl+V pasted something stale.
set -g set-clipboard off
set -s copy-command "wl-copy"
# Mouse drag release copies; stay in copy mode so the selection stays visible.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe
# Ctrl+C with a selection = copy (kitty forwards Ctrl+C here). Default was cancel.
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode C-c send-keys -X copy-pipe-and-cancel

# --- TOKYO NIGHT PRO PALETTE (Reference) ---
# BG: #1a1b26 | BLUE: #7aa2f7 | CYAN: #7dcfff | MAGENTA: #bb9af7 | GRAY: #3b4261

# --- MESSAGE & BORDER STYLING ---
# Colors used for messages (like "Config reloaded!") and pane borders.
set -g message-style "fg=#7aa2f7,bg=#3b4261,bold"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# --- PLUGIN MANAGEMENT (TPM) ---
# TPM: Tmux Plugin Manager
# Run panes as a NON-login shell. tmux defaults to a login shell, which re-runs
# /etc/profile (272ms) in every new pane -- 261ms of that is
# /etc/profile.d/vapoursynth.sh calling `vapoursynth get-vsscript`. The outer
# kitty shell already has that environment and tmux inherits it, so this is pure
# waste. Measured 2026-08-28.
set -g default-command "${SHELL}"

# --- tmux-sensible, INLINED (2026-08-28) ---
# TPM + tmux-sensible.tmux are shell scripts that fork ~20 `tmux` subprocesses
# (and two `tmux list-keys | grep`) on every COLD server start. With
# `destroy-unattached on`, the server dies with your last terminal, so a new
# terminal paid that cost EVERY time. Measured: 523ms cold -> 29ms without TPM.
# These lines are the exact settings tmux-sensible applied, as static config.
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -s default-terminal "screen-256color"
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on
bind-key a last-window
bind-key C-p previous-window
bind-key C-n next-window
bind-key R source-file ~/.tmux.conf \; display-message "Sourced ~/.tmux.conf!"

# TPM is intentionally NOT run at startup (see cost above). tmux-sensible is
# inlined above; tmux-tokyo-night is installed but unused (`status off`).
# To install/update plugins, run TPM by hand instead:
#   tmux run-shell '~/.tmux/plugins/tpm/bin/install_plugins'
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# run '~/.tmux/plugins/tpm/tpm'
