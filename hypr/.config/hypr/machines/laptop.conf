# LAPTOP machine config (AMD Picasso iGPU, eDP-1 1920x1080, Samsung TV on HDMI-A-1).
# Sourced by hyprland.conf through the untracked symlink machine.conf.
# Holds only what depends on this hardware; everything else is shared.

################
### MONITORS ###
################
monitor=eDP-1,preferred,0x0,1.5
# Samsung TV: movies only. 23.98 Hz matches film exactly, and 10-bit HDR fits HDMI bandwidth
# only at <=30 Hz. NEVER set this to 60 Hz with bitdepth 10 (froze amdgpu 2026-11-07).
monitorv2 {
    output = HDMI-A-1
    mode = 3840x2160@23.98
    position = 1280x0
    scale = 1.5
    bitdepth = 10
    cm = srgb
    supports_wide_color = 1
    supports_hdr = 1
}
monitor=,preferred,auto,auto

workspace = 1, monitor:HDMI-A-1,default:true
workspace = 2, monitor:HDMI-A-1,default:false
workspace = 3, monitor:HDMI-A-1,default:false
workspace = 4, monitor:HDMI-A-1,default:false
workspace = 5, monitor:HDMI-A-1,default:false
workspace = 6, monitor:,default:true
workspace = 7, monitor:,default:false
workspace = 8, monitor:,default:false
workspace = 9, monitor:,default:false
workspace = 10, monitor:,default:false

# Movie playback on the TV: auto-switch to HDR in fullscreen.
# direct_scanout stays 0: turning it on coincided with both screens freezing (flip_done timed out, 2026-11-07).
render {
    direct_scanout = 0
    cm_auto_hdr = 1
}
# NO quirks:prefer_hdr here. It tells EVERY client HDR is preferred; Chromium then renders
# HDR/wide-gamut and gets tone-mapped back onto eDP-1, an 8-bit ~64%-sRGB panel with no HDR
# (NV140FHM-N49, verified via edid-decode 2026-11-17) -> lifted greys, oversaturated colour.
# The TV still gets HDR for fullscreen video through render:cm_auto_hdr above.

cursor {
    no_hardware_cursors = true
}

# File manager
$fileManager = thunar
exec-once = thunar --daemon

# Keep clipboard contents after the app you copied from closes.
exec-once = wl-clip-persist --clipboard regular

# Java: no uiScale here (pep9 sets its own in the shell alias)
env = JAVA_TOOL_OPTIONS,-Dawt.useSystemAAFontSettings=lcd -Dswing.aatext=true
env = SDL_VIDEODRIVER,wayland

# Brightness: chained hardware backlight -> hyprsunset gamma (scripts/brightness-laptop.sh).
# scripts/brightness.sh is the DESKTOP's shader dimmer; do not bind it here.
exec-once = hyprsunset
exec-once = sleep 2 && $HOME/.config/hypr/scripts/brightness-laptop.sh reset
binde = $mainMod, EQUAL, exec, $HOME/.config/hypr/scripts/brightness-laptop.sh up
binde = $mainMod, MINUS, exec, $HOME/.config/hypr/scripts/brightness-laptop.sh down
bindel = ,XF86MonBrightnessUp, exec, $HOME/.config/hypr/scripts/brightness-laptop.sh up
bindel = ,XF86MonBrightnessDown, exec, $HOME/.config/hypr/scripts/brightness-laptop.sh down

# Logitech M510: flat acceleration
device {
    name = logitech-m510
    accel_profile = flat
    sensitivity = 0
}

# Paper shader toggle + its tuning HUD
bind = $mainMod SHIFT, P, exec, $HOME/dotfiles/theme/scripts/toggle-paper-shader.sh
windowrule {
    name = paper-hud

    match:class = ^(paper-hud\.py)$

    float = yes
    size = 430 660
    move = 1440 60
    pin = yes
}

windowrule {
    name = libreoffice-dialogs
    match:class = ^(soffice)$

    float = yes
    center = yes
}

# Resizing without the touchpad's right button.
# Keyboard: Super+Ctrl+hjkl grows/shrinks the focused window, repeats while held.
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40
# Touchpad: plain left-drag on the gap/border between two windows.
general {
    resize_on_border = true
    extend_border_grab_area = 15
}
