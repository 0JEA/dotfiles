################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Known outputs on this desktop. DP-2 is the left screen when it is plugged in.
#
# DP-3 is the MSI MAG 274U E16M, a 27" 4K panel (600x340mm, ~163 PPI).
# It MUST be listed explicitly. Its EDID-preferred mode is 3840x2160@60, so the
# `,preferred,auto,auto` catch-all below silently ran it at 60Hz even though the
# panel advertises 160Hz. Verified 2026-09-14 with `hyprctl monitors`: 160.00000
# after setting this, 60.00000 before.
#
# Scale 1.5 -> 2560x1440 logical, the standard sweet spot for 27" 4K. Keep this
# in sync with the -Dsun.java2d.uiScale=1.5 in JAVA_TOOL_OPTIONS further down;
# they describe the same screen and drifting them apart makes Java apps wrong.
#
# bitdepth,10: the panel is genuinely 10-bit ("Bits per primary color channel:
# 10" in the base EDID), but Hyprland was driving it 8-bit -- `hyprctl monitors`
# reported `currentFormat: XRGB8888`. Costs nothing here: 4K160 already needs DSC
# (1417.6 MHz pixel clock vs HBR3's ~25.9 Gbps usable on this 4070's DP 1.4a), so
# there is compression headroom for the extra 2 bits. Fixes gradient banding.
#
# vrr,2: fullscreen-only adaptive sync. The EDID carries an AMD FreeSync VSDB
# advertising 48-160 Hz, and DRM connector DP-3 reports `vrr_capable: 1`, so the
# panel, the cable and the OSD setting are all fine.
#
# !! AS OF 2026-09-14 THIS DOES NOT ACTUALLY ENGAGE. !!
# Verified by reading the CRTC property directly, not Hyprland's summary:
#   modetest -M nvidia-drm -p | grep -A3 VRR_ENABLED   ->   value: 0
# Tested and still 0 with vrr,1 (always-on, not just fullscreen), and still 0 at
# 2560x1440@120 -- a mode well under the DP 1.4a limit -- which rules out DSC as
# the blocker. `hyprctl configerrors` is empty, so the line parses; the NVIDIA
# driver (615.71.09) simply never flips the property. Left in place because it is
# harmless and will start working if a driver update fixes the path. Re-check
# with the modetest command above before believing VRR is on.
#
# Global VRR (1) is deliberately NOT used even once this works: it makes some
# panels flicker when the desktop framerate swings between idle and a redraw.
#
# cm,dcip3: THE IMPORTANT ONE. This panel is wide gamut, not sRGB. Gamut area
# computed from the EDID chromaticities (R 0.6757,0.3095  G 0.2646,0.6855
# B 0.1494,0.0488):
#     panel / sRGB = 1.361   (36% wider than sRGB)
#     panel / P3   = 1.003   (it is DCI-P3 to within 0.3%)
# Hyprland was set to the `srgb` preset, so sRGB content was being sent to a P3
# panel untranslated and stretched across the wider gamut: skin oversaturated,
# greens neon. `render:cm_enabled` is already 1, so the machinery was there and
# only the preset was wrong.
#
# dcip3 rather than the wiki-recommended `auto` (which resolves to `wide`,
# i.e. BT2020) ON PURPOSE. `wide` is only correct if the monitor honours the
# signalled colorimetry and maps BT2020 down to its native gamut. Plenty of
# panels ignore that and just display native, in which case BT2020-encoded
# content comes out UNDER-saturated and washed out. Because this panel measures
# as P3 to 0.3%, dcip3 is nearly a no-op if the monitor ignores signalling and
# correct if it honours it, so it is right either way. Cannot be settled from
# software: a screenshot captures buffer values, not what the panel emits.
#
# To A/B it live without editing this file (then `hyprctl reload` to come back):
#   hyprctl keyword monitor "DP-3,3840x2160@160,0x0,1.5,bitdepth,10,vrr,2,cm,wide"
#
# Desktop-wide HDR (cm,hdr) is deliberately NOT set: it is flagged experimental
# and is the known cause of washed-out SDR. Not needed anyway, `render:cm_auto_hdr`
# is already 1, which switches fullscreen HDR content into HDR on its own. The
# NVIDIA driver here (615.71.09) is past 595.58.03, so no vk-hdr-layer shim.
monitor=DP-3,3840x2160@160,0x0,1.5,bitdepth,10,vrr,2,cm,dcip3
#
# DP-2 and HDMI-A-1 are positioned RELATIVE to DP-3, not at hardcoded pixel
# offsets. The old values were `0x0` and `1920x0`, both of which collide with
# DP-3: at scale 1.5 DP-3 occupies logical x 0..2560, so DP-2 sat exactly on top
# of it and HDMI-A-1 overlapped its right two-thirds. Latent until a second
# screen is actually plugged in, at which point windows land on invisible space.
#
# auto-left / auto-right let Hyprland compute the offset from whatever DP-3's
# logical width currently is, so changing the scale above cannot desync these
# again. auto-left matches the note above: DP-2 is the left screen.
monitor=DP-2,1920x1080@60,auto-left,1
monitor=HDMI-A-1,1920x1080@60,auto-right,1
# Catch-all so any OTHER output (a new port, a TV, a dock) just works instead of
# staying black until someone edits this file.
monitor=,preferred,auto,auto

# No per-workspace monitor bindings: workspaces follow whatever is connected,
# which is the sane default when the machine usually runs one screen.
#
# The previous block pinned workspaces 1-5 to `DP-1`, an output that does not
# exist on this machine (the second port is DP-2), so those bindings silently did
# nothing and two workspaces both claimed `default:true`. Verified 2026-08-03 with
# `hyprctl monitors`: only HDMI-A-1 was connected and every workspace landed there.
#
# To split them across two screens again, uncomment and use the REAL names:
# workspace = 1, monitor:DP-2, default:true
# workspace = 2, monitor:DP-2
# workspace = 3, monitor:DP-2
# workspace = 4, monitor:DP-2
# workspace = 5, monitor:DP-2
# workspace = 6, monitor:HDMI-A-1, default:true
# workspace = 7, monitor:HDMI-A-1
# workspace = 8, monitor:HDMI-A-1
# workspace = 9, monitor:HDMI-A-1
# workspace = 10, monitor:HDMI-A-1


