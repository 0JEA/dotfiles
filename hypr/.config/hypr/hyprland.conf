# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# ── eww widget rail (Super+W) ────────────────────────────────────────────────
# Matches on the layer namespace eww declares via `:namespace "eww-panel"` in
# eww.yuck. Change it in one place and it must change in the other, or these
# rules silently stop applying — a layer rule that matches nothing is not an
# error, it just does nothing.
layerrule {
    name = eww-panel-rules
    match:namespace = ^(eww-panel)$

    blur = true
    # The rail's own background is rgba(..., 0.88). Without an alpha threshold,
    # blur is also applied to the fully transparent margin around the floating
    # card, which produces a blurred rectangle hanging in mid-air where nothing
    # is drawn.
    ignore_alpha = 0.3
    animation = slide right
}

# Example windowrules that are useful

windowrule {
    name = spotify-scratchpad
    match:class = ^(Spotify)$

    workspace = special:music silent
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Adopted from the laptop: wayland-first toolkit backends
env = GDK_BACKEND,wayland,x11
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# ── THEME COLOURS ─────────────────────────────────────────────────────────────
# Generated by matugen from theme/matugen/config.toml. Sourced LAST so it wins
# over anything above. Regenerate with theme/apply-theme.sh.
source = ~/.config/hypr/colors.conf
