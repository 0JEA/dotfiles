#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar & awww-daemon
exec-once = ~/.config/waybar/scripts/capslock-overlay.py
# Single static wallpaper (N44 superbubble). wallpaper.sh waits for
# awww-daemon then applies it via wallctl so the brightness setting is kept.
# Rotation is off: wallpaper-rotate.timer is disabled and wallmgr state is
# paused. To go back to the lattice rotation, restore the config backup in
# ~/.local/share/wallmgr/backups/, `systemctl --user enable --now
# wallpaper-rotate.timer`, `wallctl resume`, and swap this line back to:
# $HOME/Wallpapers/rotate.sh
exec-once = $HOME/Wallpapers/wallpaper.sh
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = dunst
# eww only starts the DAEMON here. The panel window itself is opened on demand
# by Super+W, and every costly poll inside it is gated on the window being open,
# so an idle daemon is close to free.
# The panel's open/closed state lives in a runtime file (see eww/scripts/panel.sh).
# Clear it on login so a session always starts with the panel closed and its
# :run-while polls stopped -- otherwise a stale "true" left by a crash would run
# playerctl, nvidia-smi and dunstctl on a timer against a window nobody opened.
exec-once = rm -f $XDG_RUNTIME_DIR/eww-panel.state; eww daemon
exec-once = systemctl --user start hyprpolkitagent

