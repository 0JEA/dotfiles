#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5

    # Order is top, right, bottom, left (CSS order) — verified by measurement,
    # not assumed. gaps_out is the gap between the tiled area and the SCREEN
    # edge, so zeroing an edge makes any window touching it bleed to that edge,
    # while gaps_in still separates windows from each other. Only the top keeps
    # a gap, to sit under the floating waybar; set it to 0 for a full bleed on
    # all four sides.
    gaps_out = 5, 0, 0, 0

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # Border colours live in colors.conf, generated by matugen and sourced at the
    # bottom of this file. Do not set col.* here — the source would override it.

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.90
    # dim_inactive = true

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 1
        vibrancy = 0.1696
        new_optimizations = true
        noise = 0
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)
# Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutExpo, 0.16, 1,    0.3,  1
    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = linear,      0,    0,    1,    1
    bezier = quick,       0.15, 0,    0.1,  1
    bezier = workspaceSnap, 0.33, 1, 0.68, 1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,                ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,              1,     10,    default
    animation = border,              1,     3,     easeOutExpo

    # Windows — bounce in, slide out
    animation = windows,             1,     5,     easeOutBack
    animation = windowsIn,           1,     5,     easeOutBack,  slide
    animation = windowsOut,          1,     4,     easeOutExpo,  slide
    animation = windowsMove,         1,     4,     easeOutBack

    # Fades — snappier
    animation = fadeIn,              1,     4,     easeOutExpo
    animation = fadeOut,             1,     3,     easeOutExpo
    animation = fade,                1,     4,     easeOutExpo

    # Layers (Waybar, Wofi, etc.) — slide in from top/bottom
    animation = layers,              1,     4,     easeOutExpo
    animation = layersIn,            1,     4,     easeOutExpo,  slide
    animation = layersOut,           1,     3,     easeOutExpo,  fade
    animation = fadeLayersIn,        1,     3,     easeOutExpo
    animation = fadeLayersOut,       1,     2,     easeOutExpo

    # Workspaces — horizontal slide
    animation = workspaces,          1,     3,     easeOutExpo,  slide
    animation = workspacesIn,        1,     3,     easeOutExpo,  slide
    animation = workspacesOut,       1,     3,     easeOutExpo,  slide

    # Special workspaces — slide up from bottom (drawer effect)
    animation = specialWorkspace,    1,     3,     easeOutExpo,  slidevert
    animation = specialWorkspaceIn,  1,     3,     easeOutExpo,  slidefadevert
    animation = specialWorkspaceOut, 1,     4,     easeOutExpo,  slidefadevert
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
