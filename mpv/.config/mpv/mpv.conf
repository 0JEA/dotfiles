# HDR playback on the Samsung TV (HDMI-A-1). Hyprland's render:cm_auto_hdr
# switches the TV into HDR when this goes fullscreen with HDR content.
vo=gpu-next
target-colorspace-hint=yes
# Default "target" makes mpv tone-map to what Hyprland reports (SDR, 80 nits),
# so the TV never gets HDR. "source" passes the video's own HDR signal through.
target-colorspace-hint-mode=source
# Decode on the GPU (VA-API); software 4K HEVC 10-bit is too slow for the Ryzen 5 3500U.
hwdec=vaapi
# English audio, no subtitles unless chosen.
alang=en,eng
sid=no
# Lock playback timing to the TV's refresh (23.98 Hz).
video-sync=display-resample
# Resume where you left off; control socket lets a playing movie be adjusted without reopening it.
save-position-on-quit=yes
input-ipc-server=/tmp/mpvsocket
# Open fullscreen on the TV when it's connected.
fs=yes
fs-screen-name=HDMI-A-1
