# vim:ft=kitty

## --- FONT ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

## --- WINDOW ---
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

## --- REMOTE CONTROL (lets external tools/scripts drive kitty, e.g. spawning
## windows and displaying images without needing their own controlling tty) ---
## MUST stay in sync with kitty/.config/kitty/kitty.conf. matugen renders this
## template over ~/.config/kitty/kitty.conf, and ~/.config/kitty is a SYMLINK
## into this repo — so apply-theme.sh writes straight through to the tracked
## file. Omitting these lines here silently deletes them from the repo on the
## next re-theme and breaks theme/scripts/show-image.sh.
allow_remote_control socket-only
listen_on unix:/tmp/kitty

## --- COLORS (Marigold) ---
background #1a1614
foreground #f5e6d3
selection_background #4a3428
selection_foreground #f5e6d3
url_color #7fb0a0
cursor #f5e6d3
cursor_text_color #1a1614

# Tabs
active_tab_background #ff8c42
active_tab_foreground #121010
inactive_tab_background #2b2320
inactive_tab_foreground #8a7867
tab_bar_background #121010

# Windows
active_border_color #ff8c42
inactive_border_color #2b2320

# Normal Colors
color0 #121010
color1 #f2543d
color2 #a3b565
color3 #fabd2f
color4 #ff8c42
color5 #e0879b
color6 #7fb0a0
color7 #d9c7b3

# Bright Colors
color8 #75665a
