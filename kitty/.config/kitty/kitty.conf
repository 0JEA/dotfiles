# vim:ft=kitty

## --- FONT ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

## --- WINDOW ---
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

## --- REMOTE CONTROL (lets external tools/scripts drive kitty, e.g. spawning
## windows and displaying images without needing their own controlling tty) ---
## MUST stay in sync with kitty/.config/kitty/kitty.conf. matugen renders this
## template over ~/.config/kitty/kitty.conf, and ~/.config/kitty is a SYMLINK
## into this repo — so apply-theme.sh writes straight through to the tracked
## file. Omitting these lines here silently deletes them from the repo on the
## next re-theme and breaks theme/scripts/show-image.sh.
allow_remote_control socket-only
listen_on unix:/tmp/kitty

## --- COLORS (Marigold) ---
background #151111
foreground #eddfde
selection_background #402a29
selection_foreground #eddfde
url_color #5de59c
cursor #eddfde
cursor_text_color #151111

# Tabs
active_tab_background #e5645d
active_tab_foreground #0e0c0b
inactive_tab_background #282222
inactive_tab_foreground #9f7c7a
tab_bar_background #0e0c0b

# Windows
active_border_color #e5645d
inactive_border_color #282222

# Normal Colors
color0 #0e0c0b
color1 #ec8b8a
color2 #8ce55d
color3 #e5bb5d
color4 #e5645d
color5 #e55db8
color6 #5de59c
color7 #d2bdbc

# Bright Colors
color8 #7e6463
color9 #ec8b8a
color10 #8ce55d
color11 #e5bb5d
color12 #e5645d
color13 #e55db8
color14 #5de59c
color15 #eddfde

# Extended Colors
color16 #e5875d
color17 #c9402c
