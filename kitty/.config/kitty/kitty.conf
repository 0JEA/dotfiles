# vim:ft=kitty

## --- FONT ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

## --- WINDOW ---
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

## --- REMOTE CONTROL (lets external tools/scripts drive kitty, e.g. spawning
## windows and displaying images without needing their own controlling tty) ---
## MUST stay in sync with kitty/.config/kitty/kitty.conf. matugen renders this
## template over ~/.config/kitty/kitty.conf, and ~/.config/kitty is a SYMLINK
## into this repo — so apply-theme.sh writes straight through to the tracked
## file. Omitting these lines here silently deletes them from the repo on the
## next re-theme and breaks theme/scripts/show-image.sh.
allow_remote_control socket-only
listen_on unix:/tmp/kitty

## --- COLORS (Marigold) ---
background #1a1b26
foreground #c0caf5
selection_background #33467c
selection_foreground #c0caf5
url_color #7dcfff
cursor #c0caf5
cursor_text_color #1a1b26

# Tabs
active_tab_background #7aa2f7
active_tab_foreground #16161e
inactive_tab_background #292e42
inactive_tab_foreground #565f89
tab_bar_background #16161e

# Windows
active_border_color #7aa2f7
inactive_border_color #292e42

# Normal Colors
color0 #16161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# Bright Colors
color8 #414868
