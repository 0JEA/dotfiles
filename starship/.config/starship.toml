# ==============================================================================
# STARSHIP CONFIGURATION (TOKYO NIGHT / CONNECTED PILLS)
# ==============================================================================

# Use a clean, one-line format
format = """
${custom.path}\
$git_branch\
$git_status\
$character
"""

# --- PATH PILLS (per-subfolder cycling colors via external script) ---
[custom.path]
command = "bash $HOME/dotfiles/theme/scripts/starship_path.sh"
when = "true"
format = "$output"
shell = ["bash"]

# --- GIT PILL ---
[git_branch]
symbol = ""
style = "bg:#bb9af7 fg:#1a1b26 bold"
# Git is optional, so we'll keep it as a standalone pill for safety.
format = "[](#bb9af7)[$symbol $branch]($style)"

[git_status]
style = "bg:#bb9af7 fg:#1a1b26 bold"
format = "[$all_status$ahead_behind]($style)[](#bb9af7) "

# --- PROMPT SYMBOL ---
[character]
success_symbol = "[❯ ](bold #7dcfff)"
error_symbol = "[❯ ](bold #f7768e)"

[line_break]
disabled = true
