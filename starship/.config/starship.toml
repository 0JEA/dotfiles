# ==============================================================================
# STARSHIP CONFIGURATION (TOKYO NIGHT / CONNECTED PILLS)
# ==============================================================================

# Directory-scan budget. Default is 30ms, which $HOME (400+ entries) exceeds on a
# cold btrfs metadata cache -> "Scanning current directory timed out" on first terminal.
scan_timeout = 500

# Use a clean, one-line format
format = """
${custom.path}\
$git_branch\
$git_status\
$character
"""

# --- PATH PILLS (per-subfolder cycling colors via external script) ---
[custom.path]
command = "bash $HOME/dotfiles/theme/scripts/starship_path.sh"
when = "true"
format = "$output"
shell = ["bash"]

# --- GIT SEGMENT ---
[git_branch]
symbol = "\uE702"
style = "bg:#73daca fg:#1a1b26 bold"
format = " [\uE0B6](#73daca)[$symbol $branch]($style)"

[git_status]
style = "bg:#73daca fg:#1a1b26 bold"
format = "[$all_status$ahead_behind]($style)[\uE0B4](fg:#73daca) "

# --- PROMPT SYMBOL ---
[character]
success_symbol = "[❯ ](bold #7dcfff)"
error_symbol = "[❯ ](bold #f7768e)"

[line_break]
disabled = true
