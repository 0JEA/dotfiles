[config]
reload_apps = false

# ── MARIGOLD ──────────────────────────────────────────────────────────────────
# Warm, saturated orange palette. Every templated app reads from this block, so
# this is the single place a palette change starts.
#
# NOTE ON THE SLOT NAMES: `blue`, `cyan` and `magenta` are historical names from
# the Tokyo Night original, not descriptions of the hue any more. They are wired
# to terminal ANSI color4 / color6 / color5 in kitty.conf.tera, AND to the
# primary UI accent in waybar/wofi/tmux/hyprlock. Renaming them would mean
# editing all seven templates, so the names stayed and the values changed.
#
#   blue    -> primary orange. Drives every UI accent and ANSI color4.
#   cyan    -> muted teal.  Deliberately COOL.
#   magenta -> dusty rose.  Deliberately COOL.
#
# cyan and magenta stay cool on purpose. If all six ANSI hues were orange,
# `ls`, diffs and syntax highlighting would lose hue distinction and turn to
# mush. Two cool anchors keep terminal output readable while the desktop still
# reads as warm, because the background, foreground and primary accent are.
[config.custom_colors]
bg        = { color = "#151111", blend = false }
bg_dark   = { color = "#0e0c0b", blend = false }
bg_hl     = { color = "#292121", blend = false }
fg        = { color = "#eddfde", blend = false }
fg_light  = { color = "#d2bdbc", blend = false }
comment   = { color = "#9f7c7a", blend = false }
blue      = { color = "#e5645d", blend = false }
cyan      = { color = "#5de59c", blend = false }
magenta   = { color = "#e55db8", blend = false }
green     = { color = "#8ce55d", blend = false }
yellow    = { color = "#e5bb5d", blend = false }
orange    = { color = "#e5875d", blend = false }
red       = { color = "#ec8b8a", blend = false }
selection = { color = "#402a29", blend = false }
gray      = { color = "#282222", blend = false }
gray2     = { color = "#3b3332", blend = false }
bright_black = { color = "#7e6463", blend = false }  # 3.26:1 on bg; #5c5148 measured 2.33 and failed

[templates.kitty]
input_path  = "~/dotfiles/theme/templates/kitty.conf.tera"
output_path = "~/.config/kitty/kitty.conf"

[templates.waybar]
input_path  = "~/dotfiles/theme/templates/waybar.css.tera"
output_path = "~/.config/waybar/style.css"

[templates.tmux]
input_path  = "~/dotfiles/theme/templates/tmux.conf.tera"
output_path = "~/.tmux.conf"

[templates.wofi]
input_path  = "~/dotfiles/theme/templates/wofi.css.tera"
output_path = "~/.config/wofi/style.css"

[templates.starship]
input_path  = "~/dotfiles/theme/templates/starship.toml.tera"
output_path = "~/.config/starship.toml"

[templates.lazygit]
input_path  = "~/dotfiles/theme/templates/lazygit.yml.tera"
output_path = "~/.config/lazygit/config.yml"

[templates.hyprcolors]
input_path  = "~/dotfiles/theme/templates/hypr-colors.conf.tera"
output_path = "~/.config/hypr/colors.conf"

[templates.hyprlock]
input_path  = "~/dotfiles/theme/templates/hyprlock.conf.tera"
output_path = "~/.config/hypr/hyprlock.conf"

# Raw slots only. The mapping onto tokyonight's colour keys stays in
# nvim/lua/plugins/example.lua, which is NOT templated, so no editor config can
# be lost to a template omission.
[templates.nvim]
input_path  = "~/dotfiles/theme/templates/nvim-palette.lua.tera"
output_path = "~/.config/nvim/lua/theme_palette.lua"

# Data-only exports. Code files (the Python HUDs, the shell prompt scripts) READ
# these rather than being templated themselves — matugen writes a rendered
# template verbatim, so templating a script would hand matugen ownership of the
# code and delete anything the template omitted.
[templates.colors_json]
input_path  = "~/dotfiles/theme/templates/colors.json.tera"
output_path = "~/.config/theme/colors.json"

[templates.colors_sh]
input_path  = "~/dotfiles/theme/templates/colors.sh.tera"
output_path = "~/.config/theme/colors.sh"

# Pure config files, safe for matugen to own end to end.
[templates.dunst]
input_path  = "~/dotfiles/theme/templates/dunstrc.tera"
output_path = "~/.config/dunst/dunstrc"

[templates.imv]
input_path  = "~/dotfiles/theme/templates/imv.config.tera"
output_path = "~/.config/imv/config"

[templates.capslockbar]
input_path  = "~/dotfiles/theme/templates/capslock-bar.css.tera"
output_path = "~/.config/waybar/capslock-bar.css"
