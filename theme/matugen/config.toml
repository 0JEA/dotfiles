[config]
reload_apps = false

# ── MARIGOLD ──────────────────────────────────────────────────────────────────
# Warm, saturated orange palette. Every templated app reads from this block, so
# this is the single place a palette change starts.
#
# NOTE ON THE SLOT NAMES: `blue`, `cyan` and `magenta` are historical names from
# the Tokyo Night original, not descriptions of the hue any more. They are wired
# to terminal ANSI color4 / color6 / color5 in kitty.conf.tera, AND to the
# primary UI accent in waybar/wofi/tmux/hyprlock. Renaming them would mean
# editing all seven templates, so the names stayed and the values changed.
#
#   blue    -> primary orange. Drives every UI accent and ANSI color4.
#   cyan    -> muted teal.  Deliberately COOL.
#   magenta -> dusty rose.  Deliberately COOL.
#
# cyan and magenta stay cool on purpose. If all six ANSI hues were orange,
# `ls`, diffs and syntax highlighting would lose hue distinction and turn to
# mush. Two cool anchors keep terminal output readable while the desktop still
# reads as warm, because the background, foreground and primary accent are.
[config.custom_colors]
bg        = { color = "#1a1614", blend = false }
bg_dark   = { color = "#121010", blend = false }
bg_hl     = { color = "#2b2320", blend = false }
fg        = { color = "#f5e6d3", blend = false }
fg_light  = { color = "#d9c7b3", blend = false }
comment   = { color = "#8a7867", blend = false }
blue      = { color = "#ff8c42", blend = false }
cyan      = { color = "#7fb0a0", blend = false }
magenta   = { color = "#e0879b", blend = false }
green     = { color = "#a3b565", blend = false }
yellow    = { color = "#fabd2f", blend = false }
orange    = { color = "#ff6b35", blend = false }
red       = { color = "#f2543d", blend = false }
selection = { color = "#4a3428", blend = false }
gray      = { color = "#2b2320", blend = false }
gray2     = { color = "#3d332e", blend = false }
bright_black = { color = "#75665a", blend = false }  # 3.26:1 on bg; #5c5148 measured 2.33 and failed

[templates.kitty]
input_path  = "~/dotfiles/theme/templates/kitty.conf.tera"
output_path = "~/.config/kitty/kitty.conf"

[templates.waybar]
input_path  = "~/dotfiles/theme/templates/waybar.css.tera"
output_path = "~/.config/waybar/style.css"

[templates.tmux]
input_path  = "~/dotfiles/theme/templates/tmux.conf.tera"
output_path = "~/.tmux.conf"

[templates.wofi]
input_path  = "~/dotfiles/theme/templates/wofi.css.tera"
output_path = "~/.config/wofi/style.css"

[templates.starship]
input_path  = "~/dotfiles/theme/templates/starship.toml.tera"
output_path = "~/.config/starship.toml"

[templates.lazygit]
input_path  = "~/dotfiles/theme/templates/lazygit.yml.tera"
output_path = "~/.config/lazygit/config.yml"

[templates.hyprcolors]
input_path  = "~/dotfiles/theme/templates/hypr-colors.conf.tera"
output_path = "~/.config/hypr/colors.conf"

[templates.hyprlock]
input_path  = "~/dotfiles/theme/templates/hyprlock.conf.tera"
output_path = "~/.config/hypr/hyprlock.conf"
